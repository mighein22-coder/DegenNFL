<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover runs the page edge to edge, under the home bar and
         (in landscape) the notch. The bottom nav, the page's bottom padding and
         the notices add env(safe-area-inset-*) to stay clear, and index.css
         pads the body sideways. The status bar below is opaque, so nothing
         needs a top inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DegenNFL</title>
    <!-- Dark, to match the manifest and the default display mode; the script
         below swaps it for the member's actual theme before first paint. -->
    <meta name="theme-color" content="#0f141d" />
    <meta name="description" content="DegenNFL: the NFL against-the-spread confidence pool." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!-- iOS ignores most of the manifest, so it needs its own tags. The status
         bar stays `black` rather than `black-translucent`: translucent draws
         white status text over the page, which is invisible on the cream light
         theme. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DegenNFL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Apply the saved display mode before first paint, so a light-mode
      // member does not see a flash of the dark palette while the bundle
      // loads. Mirrors resolveTheme() in lib/theme.ts — keep the two in step
      // (lib/__tests__/theme.test.ts pins the storage key, the default and the
      // theme-color values).
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('degennfl-theme') || 'dark'; } catch (e) {}
        var light = pref === 'light' ||
          (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        // Browser-chrome colour for the same theme (THEME_COLORS in lib/theme.ts).
        var colors = { dark: '#0f141d', light: '#f8f3e9' };
        var tag = document.querySelector('meta[name="theme-color"]');
        if (tag) tag.setAttribute('content', colors[light ? 'light' : 'dark']);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
