<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DegenNFL</title>
    <script>
      // Apply the saved display mode before first paint, so a light-mode
      // member does not see a flash of the dark palette while the bundle
      // loads. Mirrors resolveTheme() in lib/theme.ts — keep the two in step
      // (lib/__tests__/theme.test.ts pins the storage key and the default).
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('degennfl-theme') || 'dark'; } catch (e) {}
        var light = pref === 'light' ||
          (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
